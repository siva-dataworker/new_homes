org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:-UseParallelGC -XX:+UseG1GC
android.useAndroidX=true
android.ndkVersion=
android.buildToolsVersion=34.0.0

# Enable Gradle daemon
org.gradle.daemon=true

# Enable parallel builds
org.gradle.parallel=true

# Enable configuration cache to speed up builds
# Disabled due to compatibility issues with Kotlin plugins
org.gradle.configuration-cache=false

# Kotlin daemon options
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G

# Enable incremental compilation
kotlin.incremental=true
